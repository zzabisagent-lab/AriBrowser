[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "aribrowser"
version = "0.0.1"
description = "Chromium-powered text browser for AI agents"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["playwright==1.63.0", "Pillow==12.3.0"]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "pytest-asyncio==1.4.0", "ruff==0.17.0", "pyinstaller==6.22.3"]

[project.scripts]
aribrowser = "aribrowser.cli:main"

[tool.setuptools.package-data]
aribrowser = ["*.js"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
