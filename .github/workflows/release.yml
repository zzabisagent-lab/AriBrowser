# 각 네이티브 OS에서 실제 Chromium 테스트와 실행 파일 검증을 수행한다.
name: Build and verify AriBrowser
on:
  push:
    branches: [main, 'release/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -e ".[dev]"
      - name: Install Chromium and system libraries
        run: python -m playwright install --with-deps chromium
      - name: Check source and run browser integration tests
        run: |
          python -m ruff check src tests scripts
          python -m pytest -q --junitxml=test-results.xml
      - name: Build and smoke-test bundled executable
        run: python scripts/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: aribrowser-${{ matrix.os }}
          path: artifacts/*
          compression-level: 0
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.os }}
          path: test-results.xml

  release:
    # 검증된 main 또는 버전 태그에서만 공개 릴리스를 만든다.
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: aribrowser-*
          path: artifacts
          merge-multiple: true
      - name: Publish versioned binaries and checksums
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          VERSION=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            gh release upload "v$VERSION" artifacts/* --clobber
          else
            gh release create "v$VERSION" artifacts/* --target "$GITHUB_SHA" --title "AriBrowser v$VERSION" --notes-file CHANGELOG.md
          fi
