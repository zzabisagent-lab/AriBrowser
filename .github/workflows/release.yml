# 각 네이티브 OS에서 실제 Chromium 테스트와 실행 파일 검증을 수행한다.
name: Build and verify AriBrowser
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aribrowser-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -e ".[dev]"
      - name: Install Chromium and system libraries
        run: python -m playwright install --with-deps chromium
      - name: Check source and run browser integration tests
        shell: bash
        # 실패한 테스트를 GitHub 주석(::error::)으로도 남겨 로그 없이도 원인을 볼 수 있게 한다.
        run: |
          python -m ruff check src tests scripts
          set -o pipefail
          python -m pytest -q --junitxml=test-results.xml -rf --tb=short 2>&1 | tee pytest.log
          status=${PIPESTATUS[0]}
          grep -E "^(FAILED|ERROR) " pytest.log | head -n 10 | sed 's/^/::error::/' || true
          exit $status
      - name: Build and smoke-test bundled executable
        run: python scripts/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: aribrowser-${{ matrix.os }}
          path: artifacts/*
          compression-level: 0
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.os }}
          path: test-results.xml

  sandbox-ubuntu-24:
    # Ubuntu 24.04의 AppArmor userns 제한 환경에서 진단 → 정책 설치 → 샌드박스 실행을 검증한다.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies and Chromium
        run: |
          python -m pip install -e ".[dev]"
          python -m playwright install --with-deps chromium
      - name: Diagnose before policy installation
        run: |
          python -m aribrowser --doctor > doctor-before.json || true
          python -c "import json; d=json.load(open('doctor-before.json')); print(json.dumps(d['summary'], ensure_ascii=False)); print('userns', d['userns']); print('apparmor', d['apparmor'])"
      - name: Install sandbox policy as root and verify as the runner user
        run: |
          sudo -E env "PATH=$PATH" python -m aribrowser --install-sandbox > install.json
          python -c "import json; d=json.load(open('install.json')); print(json.dumps({k: v for k, v in d.items() if k != 'chromium'}, ensure_ascii=False)); assert d['install']['status'] in {'installed', 'not_needed'}, d"
      - name: Sandboxed self-test and doctor
        run: |
          python -m aribrowser --self-test
          python -m aribrowser --doctor > doctor-after.json
          python -c "import json; d=json.load(open('doctor-after.json')); print(json.dumps(d['summary'], ensure_ascii=False)); assert d['summary']['ok'] and d['sandbox']['sandbox_active'], d['summary']"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sandbox-diagnostics-ubuntu-24.04
          path: |
            doctor-before.json
            install.json
            doctor-after.json

  release:
    # 검증된 main 또는 버전 태그에서만 공개 릴리스를 만든다.
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: aribrowser-*
          path: artifacts
          merge-multiple: true
      - name: Publish versioned binaries and checksums
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          VERSION=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            gh release upload "v$VERSION" artifacts/* --clobber
          else
            gh release create "v$VERSION" artifacts/* --target "$GITHUB_SHA" --title "AriBrowser v$VERSION" --notes-file CHANGELOG.md
          fi
