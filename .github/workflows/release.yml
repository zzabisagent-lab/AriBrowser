# 각 네이티브 OS에서 실제 Chromium 테스트와 실행 파일 검증을 수행한다.
name: Build and verify AriBrowser
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aribrowser-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -e ".[dev]"
      - name: Install Chromium and system libraries
        run: python -m playwright install --with-deps chromium
      - name: Check source and run browser integration tests
        shell: bash
        timeout-minutes: 25
        # 실패한 테스트를 GitHub 주석(::error::)으로도 남겨 로그 없이도 원인을 볼 수 있게 한다.
        # 파이프(tee)는 쓰지 않는다. Windows에서 잔여 Chromium 자식 프로세스가 파이프 핸들을 물려받아
        # pytest가 끝난 뒤에도 EOF가 오지 않아 단계가 멈출 수 있다. 파일로 리디렉션하면 그런 문제가 없다.
        run: |
          python -m ruff check src tests scripts
          status=0
          python -m pytest -q --junitxml=test-results.xml -rf --tb=short --timeout=300 > pytest.log 2>&1 || status=$?
          cat pytest.log
          grep -E "^(FAILED|ERROR) " pytest.log | head -n 10 | sed 's/^/::error::/' || true
          exit $status
      - name: Build and smoke-test bundled executable
        run: python scripts/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: aribrowser-${{ matrix.os }}
          path: artifacts/*
          compression-level: 0
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.os }}
          path: test-results.xml

  sandbox-ubuntu-24:
    # Ubuntu 24.04의 AppArmor userns 제한 환경에서 진단 → 정책 설치 → 샌드박스 실행을 검증하고,
    # v0.3.0부터는 build 작업이 만든 .deb 패키지의 설치/자체 검사/제거까지 검증한다.
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies and Chromium
        run: |
          python -m pip install -e ".[dev]"
          python -m playwright install --with-deps chromium
      - uses: actions/download-artifact@v4
        with:
          name: aribrowser-ubuntu-22.04
          path: artifacts
      - name: Diagnose before policy installation
        run: |
          python -m aribrowser --doctor > doctor-before.json || true
          python -c "import json; d=json.load(open('doctor-before.json')); print(json.dumps(d['summary'], ensure_ascii=False)); print('userns', d['userns']); print('apparmor', d['apparmor'])"
      - name: Install the shared sandbox helper as root (default method) and verify as the runner user
        run: |
          sudo -E env "PATH=$PATH" python -m aribrowser --install-sandbox > install.json
          python -c "import json; d=json.load(open('install.json')); print(json.dumps({k: v for k, v in d.items() if k != 'chromium'}, ensure_ascii=False)); assert d['install']['status'] in {'installed', 'not_needed'}, d; assert d['install'].get('method', 'helper') == 'helper', d"
      - name: Sandboxed self-test and doctor with the helper (bundled Chromium, no AppArmor policy)
        run: |
          python -m aribrowser --self-test --browser bundled
          python -m aribrowser --doctor --browser bundled > doctor-helper.json
          python -c "import json; d=json.load(open('doctor-helper.json')); print(json.dumps(d['summary'], ensure_ascii=False)); assert d['summary']['ok'] and d['sandbox']['sandbox_active'] and d['sandbox_helper']['installed'], d['summary']"
      - name: Helper works for a copy of the install in a different path (install-path independence)
        run: |
          mkdir -p /tmp/elsewhere/aribrowser/_internal/playwright/driver/package/.local-browsers
          cp -r ~/.cache/ms-playwright/chromium-* /tmp/elsewhere/aribrowser/_internal/playwright/driver/package/.local-browsers/
          CHROME=$(ls -d /tmp/elsewhere/aribrowser/_internal/playwright/driver/package/.local-browsers/chromium-[0-9]*/chrome-linux*/chrome | head -n 1)
          python -m aribrowser --doctor --browser bundled --chromium "$CHROME" > doctor-elsewhere.json
          python -c "import json; d=json.load(open('doctor-elsewhere.json')); print(json.dumps(d['summary'], ensure_ascii=False)); assert d['summary']['ok'] and d['sandbox']['sandbox_source'] == 'setuid_helper', d['summary']"
      - name: Remove the helper and install the path-independent AppArmor policy instead
        run: |
          sudo -E env "PATH=$PATH" python -m aribrowser --uninstall-sandbox
          python -m aribrowser --doctor --browser bundled > doctor-none.json || true
          python -c "import json; d=json.load(open('doctor-none.json')); print(json.dumps(d['summary'], ensure_ascii=False)); assert d['summary']['error_code'] in {'SANDBOX_USERNS_RESTRICTED', None}, d['summary']"
          sudo -E env "PATH=$PATH" python -m aribrowser --install-sandbox --sandbox-method apparmor > install-apparmor.json
          python -c "import json; d=json.load(open('install-apparmor.json')); print(json.dumps({k: v for k, v in d.items() if k != 'chromium'}, ensure_ascii=False)); assert d['install']['status'] in {'installed', 'not_needed'}, d"
          CHROME=$(ls -d /tmp/elsewhere/aribrowser/_internal/playwright/driver/package/.local-browsers/chromium-[0-9]*/chrome-linux*/chrome | head -n 1)
          python -m aribrowser --doctor --browser bundled --chromium "$CHROME" > doctor-after.json
          python -c "import json; d=json.load(open('doctor-after.json')); print(json.dumps(d['summary'], ensure_ascii=False)); assert d['summary']['ok'] and d['sandbox']['sandbox_active'] and d['apparmor']['profile_covers_current'], d['summary']"
          python -m aribrowser --self-test --browser bundled
      - name: Debian package installs the sandbox helper, passes a sandboxed self-test and removes only its own files
        # 각 하위 명령의 출력을 GitHub 주석(::notice/::error)으로 남겨 작업 로그 권한 없이도 실패 원인을 볼 수 있게 한다.
        run: |
          run() { local name="$1"; shift; local out rc; if out=$("$@" 2>&1); then echo "::notice::$name ok: $(echo "$out" | tr '\n' ' ' | cut -c1-400)"; else rc=$?; echo "::error::$name failed (exit $rc): $(echo "$out" | tr '\n' ' ' | cut -c1-2000)"; exit $rc; fi; }
          run "uninstall previous sandbox" sudo -E env "PATH=$PATH" python -m aribrowser --uninstall-sandbox
          run "helper absent before deb" test ! -e /usr/local/lib/aribrowser/chrome-sandbox
          run "artifacts" ls -la artifacts
          run "apt install deb" sudo apt-get install -y ./artifacts/aribrowser_*_amd64.deb
          run "helper installed by postinst" test -u /usr/local/lib/aribrowser/chrome-sandbox
          run "version" aribrowser --version
          run "environment" sh -c "env | grep -i playwright || true; ls -la /opt/aribrowser/_internal/playwright/driver/package/.local-browsers; readlink -f /usr/bin/aribrowser"
          run "doctor chromium" sh -c "aribrowser --doctor --browser bundled --no-launch --data-dir /tmp/deb-test | python -c 'import json,sys; d=json.load(sys.stdin); print(json.dumps(d[\"chromium\"], ensure_ascii=False)); print(json.dumps(d.get(\"launch_env\"), ensure_ascii=False))'"
          run "self-test" aribrowser --self-test --browser bundled --data-dir /tmp/deb-test
          run "doctor" sh -c "aribrowser --doctor --browser bundled --data-dir /tmp/deb-test > doctor-deb.json"
          run "doctor assert" python -c "import json; d=json.load(open('doctor-deb.json')); print(json.dumps(d['summary'], ensure_ascii=False), d['sandbox'].get('sandbox_source'), d['sandbox'].get('code'), d['sandbox'].get('message')); assert d['summary']['ok'] and d['sandbox']['sandbox_active'] and d['sandbox']['sandbox_source'] == 'setuid_helper', d['summary']"
          run "jsonl session" sh -c "printf '%s\n' '{\"id\":1,\"command\":\"navigate\",\"params\":{\"url\":\"data:text/html,<title>deb</title><main><h1>Ready</h1><p>deb package runtime check</p></main>\",\"mode\":\"minimal\"}}' '{\"id\":2,\"command\":\"close\"}' | aribrowser --browser bundled --data-dir /tmp/deb-test > deb-session.jsonl"
          run "runtime assert" python -c "import json; lines=[json.loads(l) for l in open('deb-session.jsonl')]; print(json.dumps(lines[0], ensure_ascii=False)[:800]); r=lines[0]['result']; assert r['runtime']['sandbox_active'] and r['runtime']['resolved_executable'].startswith('/opt/aribrowser/'), r['runtime']"
          run "apt remove" sudo apt-get remove -y aribrowser
          run "helper removed by prerm" test ! -e /usr/local/lib/aribrowser/chrome-sandbox
          run "bundle removed" test ! -e /opt/aribrowser/aribrowser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sandbox-diagnostics-ubuntu-24.04
          path: |
            doctor-before.json
            install.json
            doctor-helper.json
            doctor-elsewhere.json
            doctor-none.json
            install-apparmor.json
            doctor-after.json
            doctor-deb.json
            deb-session.jsonl

  release:
    # 검증된 main 또는 버전 태그에서만 공개 릴리스를 만든다.
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: [build, sandbox-ubuntu-24]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: aribrowser-*
          path: artifacts
          merge-multiple: true
      - name: Publish versioned binaries and checksums
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          VERSION=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            gh release upload "v$VERSION" artifacts/* --clobber
          else
            gh release create "v$VERSION" artifacts/* --target "$GITHUB_SHA" --title "AriBrowser v$VERSION" --notes-file CHANGELOG.md
          fi
